'use strict';
const W=256,H=192,T=16,ROWS=12,GR=9;
const cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
function fit(){
  const pad=document.getElementById('pad');
  const reserve=(getComputedStyle(pad).display!=='none'?100:46)+30;
  const aw=Math.min(window.innerWidth-40,1100),ah=window.innerHeight-reserve-30;
  let s=Math.min(aw/W,ah/H); if(s>=2)s=Math.floor(s); s=Math.max(s,.75);
  cv.style.width=Math.round(W*s)+'px'; cv.style.height=Math.round(H*s)+'px';
}
window.addEventListener('resize',fit); fit();

/* ---------- sound (all synthesized, starts after first tap/key) ---------- */
let AC=null,muted=false;
function audioInit(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function beep(f,d,type,vol,slide){
  if(!AC||muted)return; try{
    const t0=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t0); if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t0+d);
    gn.gain.setValueAtTime(vol||.05,t0); gn.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(gn); gn.connect(AC.destination); o.start(t0); o.stop(t0+d+.03);
  }catch(e){}
}
function seq(list,gap,type,vol){ list.forEach((f,i)=>setTimeout(()=>beep(f,gap*1.4,type,vol),i*gap*1000)); }
const sfx={
  jump:()=>beep(300,.14,'square',.05,320), air:()=>beep(520,.12,'square',.05,380),
  coin:()=>{beep(988,.06,'square',.05);setTimeout(()=>beep(1319,.16,'square',.05),55)},
  stomp:()=>beep(200,.1,'square',.07,-120), kill:()=>seq([300,220,150],.05,'square',.06),
  hurt:()=>beep(220,.3,'sawtooth',.06,-160), swap:()=>seq([523,784],.05,'triangle',.07),
  bump:()=>beep(130,.08,'square',.06), heal:()=>seq([523,659,784,1047],.06,'square',.05),
  shield:()=>seq([880,660],.05,'triangle',.07), pick:()=>beep(660,.07,'square',.04), no:()=>beep(110,.15,'square',.06),
  frag:()=>seq([523,659,784,1047,784,1047,1319],.09,'square',.06), over:()=>seq([392,330,262,196],.16,'triangle',.08),
  pounce:()=>beep(700,.07,'triangle',.06,-300)
};
const TUNES=[
  {r:262,s:[0,4,7,4,9,7,4,2,0,4,7,12,9,7,4,2],b:[0,0,5,5,7,7,0,0]},
  {r:294,s:[0,3,7,3,10,7,3,0,0,3,7,12,10,7,5,3],b:[0,0,3,3,5,5,7,7]},
  {r:330,s:[0,7,4,7,9,7,4,7,2,9,5,9,11,9,5,2],b:[0,0,-3,-3,2,2,-5,-5]},
  {r:196,s:[0,3,7,3,0,3,8,3,-2,3,7,3,-2,2,5,2],b:[0,0,-4,-4,3,3,-2,-2]}
];
let mus=null,mstep=0;
function startMusic(i){
  stopMusic(); const tn=TUNES[i%TUNES.length];
  mus=setInterval(()=>{ if(muted||!AC)return; const n=tn.s[mstep%16];
    beep(tn.r*Math.pow(2,n/12),.13,'square',.016);
    if(mstep%4===0)beep(tn.r/2*Math.pow(2,tn.b[(mstep>>2)%8]/12),.5,'triangle',.05);
    mstep++; },155);
}
function stopMusic(){ if(mus){clearInterval(mus);mus=null;} }

const K='#14101e';
function mk(rows,pal){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length,c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1);}}});
  return c;
}
function pc(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));return c;}
function disc(x,cx,cy,r,col){x.fillStyle=col;for(let j=-r-1;j<=r+1;j++)for(let i=-r-1;i<=r+1;i++)if(i*i+j*j<=r*r+r*.7)x.fillRect(Math.round(cx+i),Math.round(cy+j),1,1);}
function px1(x,col,a,b,w,h){x.fillStyle=col;x.fillRect(a,b,w||1,h||1);}

/* ---------- level builder ---------- */
function Lv(w,theme,name,blurb){
  const m=[];for(let r=0;r<ROWS;r++)m.push(new Array(w).fill('.'));
  const L={w,theme,name,blurb,m,hints:[],signs:[],coins:[],en:[],cps:[],frag:null,boss:false};
  L.set=(x,y,c)=>{if(x>=0&&x<w&&y>=0&&y<ROWS)m[y][x]=c;return L};
  L.fill=(x0,x1,y0,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)L.set(x,y,c);return L};
  L.ground=(x0,x1)=>L.fill(x0,x1,9,11,'#');
  L.hole=(x0,x1)=>L.fill(x0,x1,9,11,'.');
  L.pond=(x0,x1)=>{L.fill(x0,x1,9,11,'.');L.fill(x0,x1,9,10,'~');return L.fill(x0,x1,11,11,'#')};
  L.wall=(x,n)=>L.fill(x,x+1,9-n,8,'#');
  L.sign=(x,i)=>{L.signs.push({x,i});return L};
  L.row=(x0,x1,y)=>{for(let x=x0;x<=x1;x++)L.coins.push({x,y});return L};
  L.e=(x,y,t)=>{L.en.push({x,y,t});return L};
  L.cp=(x)=>{L.cps.push({x});return L};
  L.F=(x,y)=>{L.frag={x,y};return L};
  return L;
}

const sol=(tx,ty)=>!!SOL[tile(tx,ty)];
function overlapWater(o){
  for(let ty=Math.floor(o.y/T);ty<=Math.floor((o.y+o.h-.01)/T);ty++)for(let tx=Math.floor(o.x/T);tx<=Math.floor((o.x+o.w-.01)/T);tx++)if(tile(tx,ty)==='~')return true;

/* move with tile collisions; returns {x,y,tx,ty}: x=-1/1 wall side, y=1 landed, y=-1 bumped head */
function mover(o,dx,dy){
  const r={x:0,y:0,tx:0,ty:0};
  if(dx){
    o.x+=dx;const y0=Math.floor(o.y/T),y1=Math.floor((o.y+o.h-.01)/T);
    if(dx>0){const tx=Math.floor((o.x+o.w-.01)/T);for(let ty=y0;ty<=y1;ty++)if(sol(tx,ty)){o.x=tx*T-o.w;r.x=1;break;}}
    else{const tx=Math.floor(o.x/T);for(let ty=y0;ty<=y1;ty++)if(sol(tx,ty)){o.x=(tx+1)*T;r.x=-1;break;}}
  }
  if(dy){
    o.y+=dy;const x0=Math.floor(o.x/T),x1=Math.floor((o.x+o.w-.01)/T);
    if(dy>0){const ty=Math.floor((o.y+o.h-.01)/T);for(let tx=x0;tx<=x1;tx++)if(sol(tx,ty)){o.y=ty*T-o.h;r.y=1;break;}}
    else{
      const ty=Math.floor(o.y/T);let best=-1,bd=1e9;
      for(let tx=x0;tx<=x1;tx++)if(sol(tx,ty)){const d=Math.abs(tx*T+8-(o.x+o.w/2));if(d<bd){bd=d;best=tx;}}
      if(best>=0){o.y=(ty+1)*T;r.y=-1;r.tx=best;r.ty=ty;}
    }
  }
  return r;
}

function updEnemy(e){
  if(e.dead){e.vy+=.3;e.y+=e.vy;e.x+=e.vx;return;}
  e.t++;if(e.hit>0)e.hit--;
  const pcx=P.x+P.w/2,pcy=P.y+P.h/2,ecx=e.x+e.w/2;
  const ty=e.type;
  if(ty==='m'){const nx=e.x0+Math.sin(e.t*.022)*40;e.dir=nx>e.x?1:-1;e.x=nx;e.y=e.y0+Math.sin(e.t*.06)*6;}
  else if(ty==='f'){
    e.y=e.y0+Math.sin(e.t*.08)*7;
    if(Math.abs(pcx-ecx)<110&&Math.abs(pcy-e.y)<90){e.dir=pcx>ecx?1:-1;e.x+=e.dir*.45;e.y0+=clamp(pcy-e.y0,-.35,.35);}
    else{e.x+=Math.sin(e.t*.03)*.4;}
  }
  else if(ty==='v'){
    const d=Math.hypot(pcx-ecx,pcy-(e.y+e.h/2));
    if(d<150){e.x+=clamp(pcx-ecx,-.5,.5);e.y0+=clamp(pcy-(e.y+e.h/2),-.4,.4);e.dir=pcx>ecx?1:-1;}
    e.y=e.y0+Math.sin(e.t*.07)*4;
  }
  else{
    const sp=ty==='r'?1.05:ty==='N'?(Math.sin(e.t*.02)>.2?1.3:.55):ty==='n'?.5:ty==='g'?.4:.5;
    if(ty==='N'){e.dir=pcx>ecx?1:-1;}
    e.vy=Math.min(e.vy+.28,6);
    let ahead=e.dir>0?e.x+e.w+2:e.x-2;
    const fy=Math.floor((e.y+e.h+2)/T);
    const edge=!sol(Math.floor(ahead/T),fy);
    if(e.vy===0||e.onG){ if(edge&&e.onG){ if(ty!=='N')e.dir*=-1; else e.vx=0; } }
    e.vx=(ty==='N'&&edge&&e.onG)?0:e.dir*sp;
    if(ty==='g'&&e.onG&&e.t%90===0)e.vy=-4;
    const r=mover(e,e.vx,0);if(r.x&&ty!=='N')e.dir*=-1;
    const r2=mover(e,0,e.vy);e.onG=false;if(r2.y===1){e.onG=true;e.vy=0;}else if(r2.y===-1)e.vy=0;

function touchEnemies(){

    if(P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y){
      if(P.vy>.6&&(P.y+P.h)-e.y<11){
        dmgEnemy(e,1);P.vy=IN.j?-5.6:-4.2;P.jumping=IN.j?1:0;P.aj=Math.max(P.aj,P.who==='aud'?1:0);
        puff(P.x+P.w/2,P.y+P.h,'#ffffff',5,1);
      }else hurt(e.x+e.w/2);
    }
  }
}

/* ---------- pet ---------- */
function updPet(){
  const px=P.x+P.w/2,feet=P.y+P.h;
  hist.unshift({x:px,y:feet,f:P.face});if(hist.length>40)hist.pop();
  const h=hist[Math.min(hist.length-1,14)];
  if(S.pet==='zz'&&PET.pt>0){
    PET.pt--;const t=PET.tg;
    if(!t||t.dead){PET.pt=0;}
    else{
      const tx=t.x+t.w/2,ty=t.y+t.h/2;PET.face=tx>PET.x?1:-1;
      PET.x+=clamp(tx-PET.x,-4.2,4.2);PET.y+=clamp(ty-PET.y,-4.2,4.2);
      if(Math.abs(tx-PET.x)<9&&Math.abs(ty-PET.y)<9){dmgEnemy(t,1);PET.pt=0;PET.cd=110;puff(PET.x,PET.y,'#ffffff',6,1.4);}
      else if(PET.pt===0)PET.cd=60;
    }
    return;
  }
  PET.x+=(h.x-13*h.f-PET.x)*.25;PET.y+=(h.y-5-PET.y)*.25;PET.face=h.f;
  if(S.pet==='zz'){
    PET.cd--;
    if(PET.cd<=0){
      let best=null,bd=120;
      for(const e of EN){if(e.dead)continue;const d=Math.hypot(e.x+e.w/2-px,e.y+e.h/2-(P.y+P.h/2));if(d<bd){bd=d;best=e;}}
      if(best){PET.tg=best;PET.pt=45;sfx.pounce();}else PET.cd=20;
    }
  }
}

/* ---------- main play update ---------- */
function updPlay(){
  S.t++;S.time++;
  if(IN.pause){IN.pause=0;S.mode='pause';stopMusic();return;}
  updPlayer();
  if(S.mode!=='play')return;
  for(const e of EN)updEnemy(e);
  touchEnemies();
  updPet();
  /* coins */
  const pcx=P.x+P.w/2,pcy=P.y+P.h/2;
  for(const c of CO){
    if(c.got)continue;
    if(S.pet==='calsy'){const d=Math.hypot(pcx-c.x,pcy-c.y);if(d<44&&d>1){c.x+=(pcx-c.x)/d*2.4;c.y+=(pcy-c.y)/d*2.4;}}
    if(Math.abs(pcx-c.x)<P.w/2+5&&Math.abs(pcy-c.y)<P.h/2+5){c.got=1;S.coins++;S.score+=10;sfx.coin();puff(c.x,c.y,'#ffd23f',4,1);coinHeal();}
  }
  /* checkpoints */
  for(const c of CPS){if(!c.on&&Math.abs(pcx-(c.x*T+8))<12&&P.y+P.h>100&&P.y<160){c.on=1;S.cp={x:c.x*T+4,y:144-P.h};sfx.pick();flash('CHECKPOINT!');puff(c.x*T+8,128,'#7affb0',10,1.4);}}
  /* signs */
  S.hint='';
  for(const s of LV.signs){if(Math.abs(pcx-(s.x*T+8))<34&&P.y>80&&P.y<160)S.hint=LV.hints[s.i];}
  /* fragment */
  const F=LV.frag;
  if(F&&fragActive()&&Math.abs(pcx-(F.x*T+8))<17&&Math.abs(pcy-(F.y*T+8))<26){stageClear();return;}
  /* fx */
  for(const b of BUMP)b.t++;BUMP=BUMP.filter(b=>b.t<10);
  for(const q of PART){q.x+=q.vx;q.y+=q.vy;q.vy+=.04;q.l--;}PART=PART.filter(q=>q.l>0);
  for(const q of POP){q.y-=.4;q.l--;}POP=POP.filter(q=>q.l>0);
  EN=EN.filter(e=>!(e.dead&&e.y>H+60));
  if(S.msgT>0)S.msgT--;
  const tx=clamp(Math.round(pcx-W/2+P.face*18),0,LV.w*T-W);cam+=(tx-cam)*.12;cam=clamp(cam,0,LV.w*T-W);
}
function stageClear(){
  S.mode='clear';S.ct=0;S.frags[S.stage]=1;S.score+=1000;stopMusic();sfx.frag();puff(LV.frag.x*T+8,LV.frag.y*T+8,'#ffffff',30,2.5);
}

function mixc(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const f=(s)=>Math.round(((A>>s)&255)*(1-t)+((B>>s)&255)*t);return'rgb('+f(16)+','+f(8)+','+f(0)+')';}

function wrap(s,maxW){

}

/* ---------- scene ---------- */
function dspS(c,x,y,flip,w,h){
  x=Math.round(x);y=Math.round(y);w=w||c.width;h=h||c.height;
  if(flip){g.save();g.translate(x+w,y);g.scale(-1,1);g.drawImage(c,0,0,w,h);g.restore();}else g.drawImage(c,x,y,w,h);
}
function enemySpr(e){

}

  drawBG(LV.theme,cam);

  for(const c of CPS){const x=Math.round(c.x*T+8-cam);g.fillStyle='#ddd';g.fillRect(x,112,2,32);g.fillStyle=c.on?'#4cf08a':'#ff5a7a';const w=c.on?(S.t>>3)%2:0;g.fillRect(x+2,112,11+w,3);g.fillRect(x+2,115,9+w,3);g.fillRect(x+2,118,6+w,3);g.fillStyle='#ffd23f';g.fillRect(x-1,110,4,3);}

  const hasP=who!=='SYS';
  if(hasP){
    const sp=who==='BRO'?SP.bro:SP[who==='AME'?'ame':'aud'].s;
    g.fillStyle='#14101e';g.fillRect(14,134,36,44);g.drawImage(sp,16,138,32,32);
    box(14,116,60,12,who==='AME'?'#6a3fb8':who==='AUD'?'#d85a9a':'#1f8a55','#fff');txt(NAMES[who],44,119,'#fff','center');
  }
  const tx=hasP?56:16,maxW=hasP?184:224;
  const shown=text.slice(0,Math.floor(d.pos));
  const ls=wrap(text,maxW),full=ls.join(' ');
  let n=0;ls.forEach((l,i)=>{const part=l.slice(0,Math.max(0,Math.floor(d.pos)-n));n+=l.length+1;txt(part,tx,134+i*11,who==='SYS'?'#ffe9a8':'#fff');});
  if(Math.floor(d.pos)>=text.length&&(S.t>>4)%2)txt('>',238,176,'#ffd23f','right');
}

/* ---------- screens ---------- */
function drawTitle(){
  drawBG(0,S.t*.5);
  for(let x=0;x<W;x+=16){g.drawImage(TS[0].top,x,152);g.drawImage(TS[0].body,x,168);}
  txt("AMELIA & AUDREY'S",128,12,'#ff9ad0','center');
  txt('8-BIT ADVENTURE',128,24,'#ffd23f','center',16);
  txt('THE QUEST FOR THE',128,46,'#fff','center');txt('ULTIMATE SQUISHY',128,57,'#2ad4c7','center');
  for(let i=0;i<4;i++)dspS(SP.frag[i],86+i*22,68+Math.sin(S.t*.07+i)*3);
  const b=Math.abs(Math.sin(S.t*.08))*4;
  dspS(SP.ame.s,70,152-32-b,false,32,32);dspS(SP.aud.s,150,152-28-(4-b),false,28,28);
  if((S.t>>5)%2===0)txt('PRESS ENTER OR TAP',128,94,'#fff','center');
  txt('1-4: STAGE SELECT',128,106,'#9a8bb5','center');
  txt('X SWAP   P PAUSE   M MUTE',128,176,'#9a8bb5','center');
}
function drawPick(){
  drawBG(0,S.t*.3);g.fillStyle='rgba(18,12,31,.78)';g.fillRect(0,0,W,H);
  txt('CHOOSE YOUR BUDDY',128,8,'#ffd23f','center');
  txt('STAGE '+(S.stage+1)+': '+LEVEL_NAMES[S.stage],128,20,'#9a8bb5','center');
  PETS.forEach((p,i)=>{
    const x=12+i*80,sel=i===S.petSel,y=34-(sel?Math.round(Math.abs(Math.sin(S.t*.15))*3):0);
    box(x,y,72,66,sel?'#3b2a63':'#241a3a',sel?'#ffd23f':'#6a5a8a');
    dspS(SP[p.id],x+15,y+10,false,42,30);
    txt(p.name,x+36,y+46,sel?'#fff':'#9a8bb5','center');
    txt(p.kind,x+36,y+56,'#9a8bb5','center');
  });
  const pt=PETS[S.petSel];
  box(12,110,232,52,'#2a1d45','#fff');
  pt.lines.forEach((l,i)=>txt(l,22,118+i*11,'#fff'));
  txt('< > CHOOSE   ENTER OK',128,172,'#2ad4c7','center');
}
const LEVEL_NAMES=['BACKYARD','BASEMENT','LAUNDRY SKY','CASTLE'];
function drawCard(){
  const th=LEVEL_FN[S.stage]();drawBG(th.theme,S.t*.4);g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,0,W,H);
  txt('STAGE '+(S.stage+1),128,46,'#ffd23f','center',16);
  txt(th.name,128,76,'#fff','center');
  wrap(th.blurb,220).forEach((l,i)=>txt(l,128,92+i*11,'#9fe8ff','center'));
  dspS(SP[PETS[S.petSel].id],110,122,false,28,20);
  txt('WITH '+PETS[S.petSel].name,128,148,'#ff9ad0','center');
  dspS(SP.frag[S.stage],116,164,false,24,24);
}
function drawOverlayScene(){drawScene();drawHUD();}
function render(){
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  const m=S.mode;
  if(m==='title')drawTitle();
  else if(m==='pick')drawPick();
  else if(m==='card')drawCard();
  else if(m==='dlg'){drawDlgScene();drawDlgBox();}
  else if(m==='end'){
    drawBG(2,S.t*.5);for(let x=0;x<W;x+=16){g.drawImage(TS[2].top,x,152);g.drawImage(TS[2].body,x,168);}
    txt('THE END',128,12,'#ffd23f','center',16);
    for(let i=0;i<4;i++){const a=S.t*.04+i*1.57;dspS(SP.frag[i],120+Math.cos(a)*54,84+Math.sin(a)*24);}
    dspS(SP.ultimate,108,70-Math.abs(Math.sin(S.t*.1))*6,false,40,40);
    dspS(SP.ame.s,50,152-16,false);dspS(SP.aud.s,190,152-14,false);dspS(SP.bro,150,152-16,true);
    txt('ULTIMATE SQUISHY BUILT!',128,128,'#fff','center');
    txt('SCORE '+String(S.score).padStart(6,'0'),128,140,'#ffd23f','center');
    if((S.t>>5)%2===0)txt('PRESS ENTER TO PLAY AGAIN',128,176,'#9fe8ff','center');
  }
  else{
    drawOverlayScene();
    if(m==='pause'){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);txt('PAUSED',128,80,'#ffd23f','center',16);txt('P OR ENTER TO RESUME',128,110,'#fff','center');}
    if(m==='dead'){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,W,H);txt('OH NO!',128,76,'#ff7a9a','center',16);txt('TRYING AGAIN...',128,100,'#fff','center');}
    if(m==='clear'){
      g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,W,H);
      const bob=Math.sin(S.t*.1)*3;dspS(SP.frag[S.stage],104,56+bob,false,48,48);
      txt('FRAGMENT GET!',128,24,'#ffd23f','center',16);
      txt((S.frags.reduce((a,b)=>a+b,0))+' OF 4 FOUND',128,116,'#fff','center');
    }
  }
}

/* ---------- step ---------- */
function goPick(){S.mode='pick';IN.tapX=-1;}
function resetGame(){S.frags=[0,0,0,0];S.score=0;S.stage=0;S.petSel=0;S.mode='title';stopMusic();}
function afterClear(){
  if(S.stage<3){S.stage++;goPick();}
  else startDialog(STORY.ending,2,()=>{S.mode='end';S.t=0;},'all');
}
function step(){
  S.t++;
  const m=S.mode;
  if(m==='title'){
    if(IN.num){S.stage=IN.num-1;goPick();}
    else if(IN.ok){S.stage=0;startDialog(STORY.intro,0,()=>goPick());}
  }else if(m==='pick'){
    if(IN.pl)S.petSel=(S.petSel+2)%3;
    if(IN.pr)S.petSel=(S.petSel+1)%3;
    if(IN.ok){
      if(IN.tapX>=0){const i=clamp(Math.floor(IN.tapX*3),0,2);if(i!==S.petSel){S.petSel=i;sfx.pick();}else{S.mode='card';S.ct=0;sfx.pick();}}
      else{S.mode='card';S.ct=0;sfx.pick();}
    }
    if(IN.pl||IN.pr)sfx.pick();
  }else if(m==='card'){
    S.ct++;if(S.ct>130||(IN.ok&&S.ct>15))startStage(S.stage);
  }else if(m==='play')updPlay();
  else if(m==='pause'){if(IN.pause||IN.ok){IN.pause=0;S.mode='play';startMusic(S.stage);}}
  else if(m==='dead'){
    S.dt++;P.vy+=.3;P.y+=P.vy;
    if(S.dt>100){P.hp=P.mh;P.shield=S.pet==='mavie';P.shCD=0;respawnAt(S.cp);S.mode='play';startMusic(S.stage);}
  }else if(m==='clear'){
    S.ct++;for(const q of PART){q.x+=q.vx;q.y+=q.vy;q.l--;}PART=PART.filter(q=>q.l>0);
    if(S.ct>170||(IN.ok&&S.ct>60)){startDialog(STORY.clear[S.stage],S.stage,afterClear,S.stage<3?S.stage:'all');}
  }else if(m==='dlg'){
    const d=S.dlg,txt_=d.lines[d.i][1];
    if(d.pos<txt_.length)d.pos+=.7;
    if(IN.ok){
      if(d.pos<txt_.length)d.pos=txt_.length;
      else{sfx.pick();d.i++;d.pos=0;if(d.i>=d.lines.length){const f=d.done;S.dlg=null;f();}}
    }
  }else if(m==='end'){if(IN.ok){resetGame();}}
  IN.ok=0;IN.pl=0;IN.pr=0;IN.num=0;IN.tapX=-1;
  if(S.mode!=='play'){IN.swap=0;IN.jb=0;}
}
let lastT=0,accT=0;
function frame(ts){
  const dt=Math.min(100,ts-lastT);lastT=ts;accT+=dt;
  while(accT>=16.667){step();accT-=16.667;}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(frame);});
try{document.fonts&&document.fonts.load('8px "Press Start 2P"');}catch(e){}
window.__g={S,IN,step,startStage,get P(){return P},get EN(){return EN},get LV(){return LV},get M(){return M},press,release,render};
</script>
