<style>
/* Layout: one centered pixel screen with a thumb pad underneath on phones. Single committed arcade look, so no light/dark switch. */
:root{--bg:#120c1f;--panel:#2a1d45;--ink:#f5eefc;--dim:#9a8bb5;--pink:#ff7ab8;--teal:#2ad4c7;--gold:#ffd23f;--px:'Press Start 2P',ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{height:100%}
body{margin:0;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:var(--px);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:12px;overflow-x:hidden}
#wrap{max-width:100%}
#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;outline:4px solid var(--panel);touch-action:none;max-width:100%}
#help{margin:4px 0 0;font-size:8px;line-height:1.8;color:var(--dim);text-align:center;max-width:560px}
#help b{color:var(--gold);font-weight:400}
#pad{display:none;width:100%;max-width:520px;justify-content:space-between;flex-wrap:wrap;gap:12px;user-select:none;-webkit-user-select:none}
@media (pointer:coarse){#pad{display:flex}#help{display:none}}
.grp{display:flex;gap:12px}
.b{width:68px;height:68px;border:3px solid var(--teal);background:var(--panel);color:var(--ink);font:10px var(--px);touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
.b:active,.b.on{background:var(--teal);color:#120c1f}
.b.sw{border-color:var(--pink)}
.b.sw:active{background:var(--pink)}
.c2{display:none}#pad[data-ch="2"] .c2{display:flex}#pad .c2.grp{width:100%;justify-content:center}.b.c2{height:52px;width:84px}.b.ab{border-color:var(--gold)}
.b:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#joy,.mg{display:none}
#joy{position:relative;width:128px;height:128px;border-radius:50%;border:3px solid var(--teal);background:rgba(42,29,69,.7);touch-action:none;-webkit-tap-highlight-color:transparent}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--teal);border:3px solid var(--ink);pointer-events:none}
.mg{gap:12px;align-items:center}
.mg .b{font-size:8px}
#pad[data-m="1"] #joy{display:block}
#pad[data-m="1"] .mg{display:flex}
#pad[data-m="1"]>.grp:not(.mg){display:none}
</style>

<script>
'use strict';
const W=256,H=192,T=16,ROWS=12,GR=9;
const cv=document.getElementById('c'),g=cv.getContext('2d');
g.imageSmoothingEnabled=false;
function fit(){
  const pad=document.getElementById('pad');
  const reserve=(getComputedStyle(pad).display!=='none'?(pad.dataset.m==='1'?150:100):46)+30;
  const aw=Math.min(window.innerWidth-40,1100),ah=window.innerHeight-reserve-30;
  let s=Math.min(aw/W,ah/H); if(s>=2)s=Math.floor(s); s=Math.max(s,.75);
  cv.style.width=Math.round(W*s)+'px'; cv.style.height=Math.round(H*s)+'px';
}
window.addEventListener('resize',fit); fit();

/* ---------- sound (all synthesized, starts after first tap/key) ---------- */
let AC=null,muted=false;
function audioInit(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function beep(f,d,type,vol,slide){
  if(!AC||muted)return; try{
    const t0=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t0); if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t0+d);
    gn.gain.setValueAtTime(vol||.05,t0); gn.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(gn); gn.connect(AC.destination); o.start(t0); o.stop(t0+d+.03);
  }catch(e){}
}
function seq(list,gap,type,vol){ list.forEach((f,i)=>setTimeout(()=>beep(f,gap*1.4,type,vol),i*gap*1000)); }
const sfx={
  jump:()=>beep(300,.14,'square',.05,320), air:()=>beep(520,.12,'square',.05,380),
  coin:()=>{beep(988,.06,'square',.05);setTimeout(()=>beep(1319,.16,'square',.05),55)},
  stomp:()=>beep(200,.1,'square',.07,-120), kill:()=>seq([300,220,150],.05,'square',.06),
  hurt:()=>beep(220,.3,'sawtooth',.06,-160), swap:()=>seq([523,784],.05,'triangle',.07),
  bump:()=>beep(130,.08,'square',.06), heal:()=>seq([523,659,784,1047],.06,'square',.05),
  shield:()=>seq([880,660],.05,'triangle',.07), pick:()=>beep(660,.07,'square',.04), no:()=>beep(110,.15,'square',.06),
  frag:()=>seq([523,659,784,1047,784,1047,1319],.09,'square',.06), over:()=>seq([392,330,262,196],.16,'triangle',.08),
  pounce:()=>beep(700,.07,'triangle',.06,-300)
};
const TUNES=[
  {r:262,s:[0,4,7,4,9,7,4,2,0,4,7,12,9,7,4,2],b:[0,0,5,5,7,7,0,0]},
  {r:294,s:[0,3,7,3,10,7,3,0,0,3,7,12,10,7,5,3],b:[0,0,3,3,5,5,7,7]},
  {r:330,s:[0,7,4,7,9,7,4,7,2,9,5,9,11,9,5,2],b:[0,0,-3,-3,2,2,-5,-5]},
  {r:196,s:[0,3,7,3,0,3,8,3,-2,3,7,3,-2,2,5,2],b:[0,0,-4,-4,3,3,-2,-2]},
  {r:349,s:[0,4,7,9,7,4,0,4,2,5,9,12,9,5,2,5],b:[0,0,5,5,2,2,7,7]},
  {r:392,s:[0,2,4,7,4,2,0,-3,0,4,7,12,7,4,2,0],b:[0,0,7,7,5,5,0,0]},
  {r:220,s:[0,3,7,10,7,3,0,-2,0,3,7,12,10,7,3,0],b:[0,0,-2,-2,3,3,-5,-5]},
  {r:440,s:[0,4,7,11,12,11,7,4,2,5,9,12,14,12,9,5],b:[0,0,5,5,7,7,2,2]},
  {r:262,s:[0,0,7,7,5,5,4,4,0,0,9,9,7,7,5,4],b:[0,5,0,5,7,2,7,2]},
  {r:247,s:[0,3,5,8,5,3,0,-4,0,3,5,8,12,8,5,3],b:[0,0,-4,-4,-2,-2,-7,-7]}
];
let mus=null,mstep=0;
function startMusic(i){
  stopMusic(); const tn=TUNES[i%TUNES.length];
  mus=setInterval(()=>{ if(muted||!AC)return; const n=tn.s[mstep%16];
    beep(tn.r*Math.pow(2,n/12),.13,'square',.016);
    if(mstep%4===0)beep(tn.r/2*Math.pow(2,tn.b[(mstep>>2)%8]/12),.5,'triangle',.05);
    mstep++; },155);
}
function stopMusic(){ if(mus){clearInterval(mus);mus=null;} }

/* ---------- pixel sprites, all drawn from code ---------- */
const K='#14101e';
function mk(rows,pal){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length,c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch!=='.'&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,j,1,1);}}});
  return c;
}
function pc(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));return c;}
function disc(x,cx,cy,r,col){x.fillStyle=col;for(let j=-r-1;j<=r+1;j++)for(let i=-r-1;i<=r+1;i++)if(i*i+j*j<=r*r+r*.7)x.fillRect(Math.round(cx+i),Math.round(cy+j),1,1);}
function px1(x,col,a,b,w,h){x.fillStyle=col;x.fillRect(a,b,w||1,h||1);}

/* heroes v2. Amelia: 16x20, taller and rounder, long black hair with a lilac hairband, purple dress, black leggings.
   Audrey: 14x18, shorter and slim, shoulder-length brown hair with a pink bow, pink top, blue overalls. */
const AMT=[
'.....kkkkkkk....','...kkHHHHhHHkk..','..kHHhhHHHhHHHk.','.kHHHHHHHHHHHHk.','.kHHTTTTgTTTTHk.','.kHSSSSSSSSSSHk.',
'.kHSSeSSSSeSSHk.','.kHSSeSSSSeSSHk.','.kHSpSSSSSSpSHk.','.kHHSSSmmSSSHHk.','..kHHkSSSSkHHk..','..kHkAACCAAkHk..',
'.kHHkCCAACCkHHk.','.kHHkCCAACckHHk.','..kHkCCCCCckHk..','.kCACCACCACCACk.'];
const AML={
 s:['..kLLLLkkLLLLk..','..kLLLk..kLLLk..','..kPPPk..kPPPk..','..kkkkk..kkkkk..'],
 a:['..kLLLLkkLLLLk..','.kLLLk....kLLLk.','.kPPPk....kPPPk.','.kkkkk....kkkkk.'],
 b:['...kLLLLLLLLk...','....kLLLLLLk....','....kPPPPPPk....','....kkkkkkkk....'],
 j:['..kLLLLkkLLLLk..','.kPPPPk..kLLLk..','.kkkkkk..kPPPk..','.........kkkkk..']};
const AUT=[
'....kkkkkk....','..kkHHHPPPkk..','.kHHhhHPPPQHk.','.kHHHHHHHHHHk.','.kHHSSSSSSHHk.','.kHSSSSSSSSHk.',
'.kHSeSSSSeSHk.','.kHSeSSSSeSHk.','.kHSpSSSSpSHk.','.kHHSSmmSSHHk.','..kHkSSSSkHk..','..kHkAAAAkHk..',
'...kkCAACkk...','....kyCCyk....','...kCCPCCCk...'];
const AUL={
 s:['..kSSk..kSSk..','..kPPk..kPPk..','..kkkk..kkkk..'],
 a:['.kSSk....kSSk.','.kPPk....kPPk.','.kkkk....kkkk.'],
 b:['....kSSSSk....','....kPPPPk....','....kkkkkk....'],
 j:['..kSSk...kSSk.','.kPPPk...kPPk.','.kkkkk...kkkk.']};
function hero(top,legs,pal){const f=n=>mk(top.concat(legs[n]),pal);return{s:f('s'),a:f('a'),b:f('b'),j:f('j')};}
const SP={
 ame:hero(AMT,AML,{g:'#ffd23f',k:K,H:'#241a36',h:'#4a3a6e',T:'#b98aff',S:'#f3bb98',p:'#f08fa0',e:K,m:'#c0505e',C:'#8a4fe0',c:'#6a38b8',A:'#d9b8ff',L:'#2a2040',P:'#b98aff'}),
 aud:hero(AUT,AUL,{y:'#ffd23f',k:K,H:'#8a5a36',h:'#b07a4e',P:'#ff7ab8',Q:'#c8508a',S:'#f7cba8',p:'#f08fa0',e:K,m:'#c0505e',A:'#ff9ac8',C:'#3a8cff'})
};
/* hitboxes (w,h): Amelia is bigger and heavier */
const BODY={ame:{w:12,h:18},aud:{w:9,h:15}};

/* pets */
const CAT=[
'........k..k..','........kBkkBk','........kBBBBk','.k......kBBBek','.kk.....kBBnBk','..kBBkkkkBBBBk',
'..kBDBDBDBBBk.','...kBBBBBBBk..','...kBBk..kBBk.','...kkkk..kkkk.'];
const DOG=[
'........kkkk..','.......kBBBBk.','.......kDBBBBk','.......kDBBeBk','.kk....kBBBBnk','..kBBBBBBBBTk.',
'..kBBBBBBBBBk.','..kBBBBBBBBBk.','...kBBk..kBBk.','...kkkk..kkkk.'];
SP.zz=mk(CAT,{k:'#1b1626',B:'#9aa0ad',D:'#6e7482',n:'#ff9ab0',e:K});
SP.calsy=mk(CAT,{k:'#2a1608',B:'#f0933a',D:'#c86a1e',n:'#ff9ab0',e:K});
SP.mavie=mk(DOG,{k:'#2a2038',B:'#fbfbff',D:'#c9c3d9',n:K,T:'#ff8aa0',e:K});

/* common enemies */
const MQ=['...ww..ww.....','..wwww.wwww...','...ww..ww.....','..kkkkkkk.....','.kGGGGGGGkR...','kkGDGDGDGGkkkk','.kGGGGGGGkR...','..kkkkkkk.....','..k.k.k.k.....'];
const mqp={w:'#cfeaff',k:K,G:'#8a8f9c',D:'#5c6070',R:'#ff4d5e'};
SP.mosq=[mk(MQ,mqp),mk(['..............','..............','.wwwwwwwwww...'].concat(MQ.slice(3)),mqp)];
const FL=['..ww..ww..','.wwww.www.','..kBBBBk..','.kRBBBBRk.','.kBBBBBBk.','..kBDDBk..','..k.kk.k..'];
const flp={w:'#cfeaff',k:K,B:'#3a3550',D:'#5a5478',R:'#ff4d5e'};
SP.fly=[mk(FL,flp),mk(['..........','..........','.wwwwwwww.'].concat(FL.slice(3)),flp)];
const SPD=['..k......k..','.k..kkkk..k.','k..kDDDDk..k','..kDDDDDDk..','kkkDRDDRDkkk','..kDDDDDDk..','.k..kkkk..k.','k..k....k..k'];
SP.spid=mk(SPD,{k:K,D:'#6a4630',R:'#ff4d5e'});

/* strong enemies, drawn procedurally */
SP.germ=pc(16,16,x=>{
  for(let a=0;a<8;a++){const an=a*Math.PI/4,cx=8+Math.cos(an)*6.5,cy=8+Math.sin(an)*6.5;px1(x,'#1f6a38',Math.round(cx)-1,Math.round(cy)-1,2,2);}
  disc(x,8,8,5.5,'#1f6a38'); disc(x,8,8,4.5,'#4fd16f'); px1(x,'#8cf0a4',5,5,2,1);
  px1(x,'#fff',5,7,2,2);px1(x,'#fff',9,7,2,2);px1(x,K,6,8,1,1);px1(x,K,9,8,1,1);px1(x,K,4,6,2,1);px1(x,K,10,6,2,1);px1(x,K,6,11,4,1);
});
SP.virus=pc(16,16,x=>{
  for(let a=0;a<8;a++){const an=a*Math.PI/4+.4;for(let r=4;r<=7;r++)px1(x,'#6a2a8a',Math.round(8+Math.cos(an)*r),Math.round(8+Math.sin(an)*r));
    px1(x,'#ff4d5e',Math.round(8+Math.cos(an)*7.3)-1,Math.round(8+Math.sin(an)*7.3)-1,2,2);}
  disc(x,8,8,4.5,'#6a2a8a'); disc(x,8,8,3.6,'#b85de0'); px1(x,'#e3a8f5',6,6,2,1);
  px1(x,'#fff',6,7,1,2);px1(x,'#fff',9,7,1,2);px1(x,K,6,8,1,1);px1(x,K,9,8,1,1);px1(x,K,6,10,4,1);
});
SP.roach=pc(16,10,x=>{
  for(let j=0;j<10;j++)for(let i=0;i<16;i++){const u=(i-7)/7,v=(j-5)/3.6;if(u*u+v*v<=1)px1(x,j<3?'#a8683a':'#6a3e20',i,j);}
  px1(x,'#d9915a',3,3,8,1);px1(x,'#3a2010',7,2,1,7);
  disc(x,14,5,1.6,'#3a2010');px1(x,'#ff4d5e',14,4);px1(x,K,15,1);px1(x,K,14,2);px1(x,K,13,1);px1(x,K,15,3);
  [3,7,11].forEach(i=>{px1(x,K,i,9);px1(x,K,i+1,8);});
});
function snakeSpr(ph){return pc(24,14,x=>{
  for(let k=0;k<5;k++){const cx=3+k*3.6,cy=9+Math.sin(k*1.3+ph)*2;disc(x,cx,cy,3,'#1f6a38');}
  for(let k=0;k<5;k++){const cx=3+k*3.6,cy=9+Math.sin(k*1.3+ph)*2;disc(x,cx,cy,2.2,k%2?'#4fd16f':'#3ea65a');}
  disc(x,19,6,4,'#1f6a38');disc(x,19,6,3.2,'#4fd16f');
  px1(x,'#fff',19,4,2,2);px1(x,K,20,5);px1(x,'#ffd23f',18,3);px1(x,'#ff4d5e',22,8,2,1);px1(x,'#ff4d5e',23,9);
});}
SP.snake=[snakeSpr(0),snakeSpr(1.6)];

/* squishy fragments, one per stage */
const FRC=[['#ff7ab8','#b84d86','#ffc2e0'],['#ffd23f','#c89a14','#fff0a0'],['#4aa8ff','#2a6cc0','#a8d8ff'],['#5ee08a','#2e9c54','#b0f5c8']];
const FRP=[
  [[8,9,5],[5,4,2],[11,4,2]],
  [[8,8,5],[8,2,1],[8,14,1],[2,8,1],[14,8,1]],
  [[8,10,5],[8,5,3],[8,3,1]],
  [[5,9,4],[11,9,4],[8,6,4]]];
function fragSpr(i){const[c,d,h]=FRC[i];return pc(16,16,x=>{
  FRP[i].forEach(([a,b,r])=>disc(x,a,b,r+1,d)); FRP[i].forEach(([a,b,r])=>disc(x,a,b,r,c));
  px1(x,h,5,7,2,2);px1(x,h,7,6,1,1);px1(x,'#fff',6,7);px1(x,K,6,11,1,1);px1(x,K,10,11,1,1);
});}
SP.frag=[0,1,2,3].map(fragSpr);
SP.heart=mk(['.RR.RR.','RRRRRRR','RRRRRRR','.RRRRR.','..RRR..','...R...'],{R:'#ff3d6e'});
SP.heartE=mk(['.RR.RR.','RRRRRRR','RRRRRRR','.RRRRR.','..RRR..','...R...'],{R:'#46344f'});
SP.coin=pc(8,8,x=>{disc(x,4,4,3,'#b8860b');disc(x,4,4,2.3,'#ffd23f');px1(x,'#fff6b0',3,2,1,2);});
function dspr(c,x,y,flip){
  x=Math.round(x);y=Math.round(y);
  if(flip){g.save();g.translate(x+c.width,y);g.scale(-1,1);g.drawImage(c,0,0);g.restore();}else g.drawImage(c,x,y);
}

/* brother sprite for dialogue */
SP.bro=mk([
'...kkkkkkkk...','..kHHHHHHHHk..','.kHHHHHHHHHHk.','.kHSSSSSSSSHk.','.kSSkSSSSkSSk.','.kSSSSSSSSSSk.',
'.kSSSSkkSSSSk.','..kkSSSSSSkk..','..kGGGGGGGGk..','.kGGGGGGGGGGk.','.kSGGGGGGGGSk.','.kSGGGGGGGGSk.',
'..kGGGGGGGGk..','..kJJkkkkJJk..','..kJJk..kJJk..','..kkkk..kkkk..'],
{k:K,H:'#2b1f14',S:'#e8b48c',G:'#2fae6b',J:'#3a4a9c'});

/* the finished toy: four fragments joined */
SP.ultimate=pc(40,40,x=>{
  const cols=FRC.map(c=>c[0]),dk=FRC.map(c=>c[1]);
  disc(x,20,20,19,'#14101e');
  for(let j=0;j<40;j++)for(let i=0;i<40;i++){const dx=i-19.5,dy=j-19.5;if(dx*dx+dy*dy<=17.5*17.5){
    const q=(dx<0?0:1)+(dy<0?0:2);x.fillStyle=(i+j)%7===0?dk[q]:cols[q];x.fillRect(i,j,1,1);}}
  px1(x,'#fff',11,15,4,4);px1(x,'#fff',25,15,4,4);px1(x,K,13,16,2,3);px1(x,K,27,16,2,3);
  px1(x,K,15,26,10,1);px1(x,K,14,25,1,1);px1(x,K,25,25,1,1);px1(x,'#ff7ab8',8,22,3,2);px1(x,'#ff7ab8',29,22,3,2);
  px1(x,'#fff',9,7,3,2);px1(x,'#fff',10,9,1,1);
});

/* ---------- level builder ---------- */
function Lv(w,theme,name,blurb,rows,gy){
  rows=rows||12;gy=gy==null?rows-3:gy;
  const m=[];for(let r=0;r<rows;r++)m.push(new Array(w).fill('.'));
  const L={w,theme,name,blurb,m,rows,gy,hints:[],signs:[],coins:[],en:[],cps:[],pads:[],vines:[],buds:[],dig:[],frag:null,boss:false};
  L.set=(x,y,c)=>{if(x>=0&&x<w&&y>=0&&y<rows)m[y][x]=c;return L};
  L.fill=(x0,x1,y0,y1,c)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)L.set(x,y,c);return L};
  L.ground=(x0,x1)=>L.fill(x0,x1,gy,rows-1,'#');
  L.hole=(x0,x1)=>L.fill(x0,x1,gy,rows-1,'.');
  L.pond=(x0,x1)=>{L.fill(x0,x1,gy,rows-1,'.');L.fill(x0,x1,gy,gy+1,'~');return L.fill(x0,x1,gy+2,rows-1,'#')};
  L.wall=(x,n)=>L.fill(x,x+1,gy-n,gy-1,'#');
  L.sign=(x,i,y)=>{L.signs.push({x,i,y:y==null?gy-1:y});return L};
  L.row=(x0,x1,y)=>{for(let x=x0;x<=x1;x++)L.coins.push({x,y});return L};
  L.e=(x,y,t)=>{L.en.push({x,y,t});return L};
  L.cp=(x,y)=>{L.cps.push({x,y:y==null?gy:y});return L};
  L.F=(x,y)=>{L.frag={x,y};return L};
  L.pad=(x,y,kind,o)=>{L.pads.push(Object.assign({x,y,kind},o||{}));return L};
  L.vine=(ax,ay,len,amp,sp,ph)=>{L.vines.push({ax:ax*T+8,ay:ay*T,len:len*T,amp,sp,ph});return L};
  L.bud=(x,y,bw,bh,pad)=>{L.buds.push({x,y,w:bw,h:bh,pad});return L};
  L.digAt=(x,y,heart)=>{L.dig.push({x,y,heart:!!heart});return L};
  return L;
}

/* every level gets one hidden "sky ladder" with a secret star on top, placed in the first free flat stretch */
const KEEP3=['N','gm','thc','jbr','bee','sbd'];
const KEEP2=['N','gm','thc','jbr','bee','sbd','cbat','jck','car'];
const KEEPEN=['N','gm','thc','jbr','bee','sbd','cbat','jel','puf','tcr','mhp','vtp','jck','car'];
function addSecret(L){
  const gy=L.gy,m=L.m,w=L.w;
  if(gy<8){L.secret=null;return;}
  const busy=x=>L.en.some(e=>(e.t==='N'||e.t==='gm')&&Math.abs(e.x-x)<4)||L.pads.some(p=>Math.abs(p.x-x)<2)||L.vines.some(v=>Math.abs(v.ax/T-x)<4)||L.buds.some(b=>x>=b.x-1&&x<=b.x+(b.w||2)+1)||(L.frag&&Math.abs(L.frag.x-x)<2)||(L.arena&&x>=L.arena.x0-2)||(L.winds||[]).some(q=>x>=q.x0-1&&x<=q.x1+1)||(L.vents||[]).some(v=>Math.abs(v.x-x)<3);
  const free=(x,y,soft)=>{if(x<0||x>=w||y<0||y>=L.rows)return false;const c=m[y][x];return c==='.'||c==='~'||(soft&&'?Bbh'.includes(c));};
  const groundOK=x=>'#QBU'.includes(m[gy][x])&&m[gy][x]!=='.'&&!busy(x);
  /* wide ladder first (3-tile steps), then a compact one (2-tile steps) */
  for(const [need,sw,gap] of [[12,3,1],[10,2,1],[8,2,0]]){
    const tryAt=(x0,strict)=>{
      for(let i=0;i<need;i++)if(!groundOK(x0+i))return false;
      const a=x0+1,b2=a+sw+gap,c2=b2+sw+gap;let clutter=0;
      for(let x=x0;x<x0+need;x++)for(let y=gy-8;y<gy;y++)if(!free(x,y))clutter++;
      if(clutter>8)return false;
      for(let x=a-1;x<=c2+sw;x++)for(let y=gy-8;y<gy;y++)if(!free(x,y,strict>=4))return false;
      const inW=L.en.filter(e=>e.x>=x0-1&&e.x<=x0+need);
      if(inW.some(e=>(strict>=5?KEEP3:strict>=2?KEEP2.filter(k=>strict<3||k!=='bee'):KEEPEN).includes(e.t)))return false;
      if(strict===0&&inW.length)return false;
      for(const [px,py] of [[a,gy-2],[b2,gy-4],[c2,gy-6]])for(let i=0;i<sw;i++)for(let k=0;k<3;k++)if(!free(px+i,py-k+ (k?0:0))&&!(k===0&&false))return false;
      return free(c2+(sw>>1),gy-8)&&free(c2+(sw>>1),gy-7);
    };
    let x0=-1;
    for(const strict of [0,1,2,3,4,5]){
      for(let s2=Math.floor(w*.45);s2<=w-need-4&&x0<0;s2++)if(tryAt(s2,strict))x0=s2;
      for(let s2=4;s2<Math.floor(w*.45)&&x0<0;s2++)if(tryAt(s2,strict))x0=s2;
      if(x0>=0)break;
    }
    if(x0<0)continue;
    L.en=L.en.filter(e=>!(e.x>=x0-1&&e.x<=x0+need));
    const a=x0+1,b2=a+sw+gap,c2=b2+sw+gap;
    for(let x=a-1;x<=c2+sw;x++)for(let y=gy-8;y<gy;y++)if('?Bbh'.includes(m[y][x]))m[y][x]='.';
    L.fill(a,a+sw-1,gy-2,gy-2,'#').fill(b2,b2+sw-1,gy-4,gy-4,'#').fill(c2,c2+sw-1,gy-6,gy-6,'#');
    L.row(a+(sw>>1),a+(sw>>1),gy-3).row(b2+(sw>>1),b2+(sw>>1),gy-5).row(c2+(sw>>1),c2+(sw>>1),gy-7);
    L.secret={x:c2+(sw>>1),y:gy-8,plats:[[a,gy-2,sw],[b2,gy-4,sw],[c2,gy-6,sw]]};return;
  }
  L.secret=null;
}

function mover(o,dx,dy){
  const r={x:0,y:0,tx:0,ty:0};
  if(dx){
    o.x+=dx;const y0=Math.floor(o.y/T),y1=Math.floor((o.y+o.h-.01)/T);
    if(dx>0){const tx=Math.floor((o.x+o.w-.01)/T);for(let ty=y0;ty<=y1;ty++)if(sol(tx,ty)){o.x=tx*T-o.w;r.x=1;break;}}
    else{const tx=Math.floor(o.x/T);for(let ty=y0;ty<=y1;ty++)if(sol(tx,ty)){o.x=(tx+1)*T;r.x=-1;break;}}
  }
  if(dy){
    o.y+=dy;const x0=Math.floor(o.x/T),x1=Math.floor((o.x+o.w-.01)/T);
    if(dy>0){const ty=Math.floor((o.y+o.h-.01)/T);for(let tx=x0;tx<=x1;tx++)if(sol(tx,ty)){o.y=ty*T-o.h;r.y=1;break;}}
    else{

  }

}

function updEnemy(e){
  if(e.dead){e.vy+=.3;e.y+=e.vy;e.x+=e.vx;return;}
  e.t++;if(e.hit>0)e.hit--;
  const pcx=P.x+P.w/2,pcy=P.y+P.h/2,ecx=e.x+e.w/2;
  const ty=e.type;
  if(BRAINS[ty]){brainCh2(e,ty,pcx,pcy,ecx);return;}
  if(ty==='m'){const nx=e.x0+Math.sin(e.t*.022)*40;e.dir=nx>e.x?1:-1;e.x=nx;e.y=e.y0+Math.sin(e.t*.06)*6;}
  else if(ty==='f'){
    e.y=e.y0+Math.sin(e.t*.08)*7;
    if(Math.abs(pcx-ecx)<110&&Math.abs(pcy-e.y)<90){e.dir=pcx>ecx?1:-1;e.x+=e.dir*.45;e.y0+=clamp(pcy-e.y0,-.35,.35);}
    else{e.x+=Math.sin(e.t*.03)*.4;}
  }
  else if(ty==='v'){
    const d=Math.hypot(pcx-ecx,pcy-(e.y+e.h/2));
    if(d<150){e.x+=clamp(pcx-ecx,-.5,.5);e.y0+=clamp(pcy-(e.y+e.h/2),-.4,.4);e.dir=pcx>ecx?1:-1;}
    e.y=e.y0+Math.sin(e.t*.07)*4;
  }
  else{
    const sp=ty==='r'?1.05:ty==='N'?(Math.sin(e.t*.02)>.2?1.3:.55):ty==='n'?.5:ty==='g'?.4:.5;
    if(ty==='N'){e.dir=pcx>ecx?1:-1;}
    e.vy=Math.min(e.vy+.28,6);
    let ahead=e.dir>0?e.x+e.w+2:e.x-2;
    const fy=Math.floor((e.y+e.h+2)/T);
    const edge=!sol(Math.floor(ahead/T),fy);
    if(e.vy===0||e.onG){ if(edge&&e.onG){ if(ty!=='N')e.dir*=-1; else e.vx=0; } }
    e.vx=(ty==='N'&&edge&&e.onG)?0:e.dir*sp;
    if(ty==='g'&&e.onG&&e.t%90===0)e.vy=-4;
    const r=mover(e,e.vx,0);if(r.x&&ty!=='N')e.dir*=-1;
    const r2=mover(e,0,e.vy);e.onG=false;if(r2.y===1){e.onG=true;e.vy=0;}else if(r2.y===-1)e.vy=0;
    if(e.y>LV.rows*T+40)e.dead=1;
  }
}

function updPet(){

  PET.idle=(Math.abs(PET.vx)<.2&&Math.abs(PET.vy)<.3)?(PET.idle||0)+1:0;PET.age=(PET.age||0)+1;
  hist.unshift({x:px,y:feet,f:P.face});if(hist.length>40)hist.pop();
  const h=hist[Math.min(hist.length-1,14)];
  if(S.pet==='zz'&&PET.pt>0){
    PET.pt--;const t=PET.tg;
    if(!t||t.dead){PET.pt=0;}
    else{
      const tx=t.x+t.w/2,ty=t.y+t.h/2;PET.face=tx>PET.x?1:-1;
      PET.x+=clamp(tx-PET.x,-4.2,4.2);PET.y+=clamp(ty-PET.y,-4.2,4.2);

      else if(PET.pt===0)PET.cd=60;
    }
    return;
  }
  {const tx=h.x-13*h.f,ty=h.y-5,ddx=tx-PET.x,ddy=ty-PET.y;if(Math.abs(ddx)>110||Math.abs(ddy)>110){PET.x=tx;PET.y=ty;puff(PET.x,PET.y,'#ffffff',6,1.2);}else{PET.x+=clamp(ddx*.25,-3.4,3.4);PET.y+=clamp(ddy*.25,-6,6);}}
  if(Math.abs(PET.vx)>.35)PET.face=PET.vx>0?1:-1;else if(PET.idle>16)PET.face=h.f;
  const airNow=Math.abs(PET.vy)>.9;if(PET.wasAir&&!airNow&&!PET.pt){PET.land=7;if(Math.random()<.9)puff(PET.x,PET.y+5,'#d9c9a8',3,.6);}PET.wasAir=airNow;if(PET.land>0)PET.land--;
  if(Math.abs(PET.vx)>.9&&!airNow&&(S.t%9===0))puff(PET.x-PET.face*5,PET.y+5,'#d9c9a8',1,.5);
  if(S.pet==='zz'){

      if(best){PET.tg=best;PET.pt=45;sfx.pounce();}else PET.cd=20;
    }
  }
}

  if(S.bossOn&&LV.arena){cam+=(LV.arena.x0*T-cam)*.2;cy=LV.rows*T-H;}
}

  for(const pd of PADS)if(Math.abs(cx-(pd.x*T+8))<14&&Math.abs((P.y+P.h)-pd.y*T)<6&&P.onG)return pd;
  return null;
}

    for(const g2 of pd.gate){if(M[g2[1]][g2[0]]==='G'){M[g2[1]][g2[0]]='.';puff(g2[0]*T+8,g2[1]*T+8,'#ff9ad0',8,1.4);}}

}

function bossBrain(e,pcx,pcy,ecx){
  const a=LV.arena,fl=LV.gy*T;
  if(e.gi===undefined){e.gi=1;e.st='sleep';e.sm=0;e.stn=0;e.gt=0;e.fr=0;e.vuln=0;e.soft=0;e.cl=0;}
  if(e.cl>0)e.cl--;
  if(e.st==='sleep'){e.h=40;e.y=fl-e.h;e.fr=0;if(!S.bossOn&&P.x>(a.x0+2)*T)bossEngage(e);return;}
  e.sm++;
  const ph=e.fixed?5:e.hp>=8?1:e.hp>=4?2:e.hp>=2?3:4;
  if(ph===4&&e.st!=='fin'&&!e.fixed){e.st='fin';e.sm=0;e.vuln=0;e.soft=1;e.h=40;WAVES=[];GEARS=[];sfx.buzz();flash('HE IS WOBBLING! USE THE SYNC PAD!');pop(e.x-4,e.y-14,'WOBBLE...','#9fe8ff');}
  const lo=a.x0*T+e.w/2+4,hi=(a.x1+1)*T-e.w/2-4,dm=[1.3,1,.8][S.diff];
  const P3=ph===3;
  if(e.st==='walk'){
    e.h=40;e.vuln=0;e.soft=0;e.fr=(e.sm>>3)&1;
    const sp=[0,.55,.7,.9][ph]||.5;e.dir=pcx>ecx?1:-1;
    e.x=clamp(e.x+e.dir*sp,lo-e.w/2,hi-e.w/2);
    if(e.sm>([0,110,95,75][ph]*dm)){e.st='wind';e.sm=0;}
  }else if(e.st==='wind'){
    e.fr=2;e.dir=pcx>ecx?1:-1;
    if((e.sm&3)===0)puff(e.x+e.w/2,e.y+4,'#ffd23f',1,.8);
    if(e.sm>(P3?26:36)){e.st='slam';e.sm=0;}
  }else if(e.st==='slam'){
    e.fr=3;
    if(e.sm===1){
      sfx.slam();ring(e.x+e.w/2,fl-4,'#ffd23f',28);puff(e.x+e.w/2,fl-2,'#c8c8d8',10,1.6);
      const sp=([0,1.6,1.9,2.3][ph]||1.6)*[.85,1,1.15][S.diff];
      for(const d of [-1,1]){WAVES.push({x:e.x+e.w/2+d*14,dir:d,sp,d:0});if(P3)WAVES.push({x:e.x+e.w/2+d*14,dir:d,sp:sp*.8,d:26});}
    }
    if(e.sm>14){e.st='stun';e.sm=0;e.stn=0;flash('DIZZY! STOMP HIM!');}
  }else if(e.st==='stun'){
    e.h=30;e.vuln=1;e.soft=1;e.fr=4;
    if((e.sm&7)===0)puff(e.x+e.w/2,e.y,'#ffe27a',1,.8);
    if(e.stn>=2||e.sm>190){e.st='recover';e.sm=0;}
  }else if(e.st==='recover'){
    e.h=30;e.vuln=0;e.soft=1;e.fr=4;
    if(e.sm>30){e.st='walk';e.sm=0;e.h=40;e.soft=0;e.stn=0;}
  }else if(e.st==='fin'){
    e.h=40;e.fr=6;e.vuln=0;e.soft=1;
    if(e.sm%24===0)puff(e.x+e.w/2+(Math.random()*20-10),e.y+8,'#ffd23f',2,1.2);
  }else if(e.st==='happy'){
    e.h=40;e.fr=5;e.soft=1;
    if(e.sm%18===0)PART.push({x:e.x+e.w/2+(Math.random()*24-12),y:e.y+6,vx:0,vy:-.7,l:50,c:'#ff7a9a',s:3});
  }
  e.y=fl-e.h;
  /* falling gears (phase 2+) */
  if((ph===2||ph===3)&&(e.st==='walk'||e.st==='wind'||e.st==='slam')){
    e.gt++;if(e.gt>=(ph===2?110:75)*dm){e.gt=0;GEARS.push({x:clamp(pcx,a.x0*T+10,(a.x1+1)*T-10),y:-12,vy:0,warn:55,st:0,r:0});}
  }
  /* waves */
  for(const w of WAVES){
    if(w.d>0){w.d--;continue;}
    w.x+=w.dir*w.sp;
    if(P.y+P.h>fl-9&&P.x<w.x+6&&P.x+P.w>w.x-6)hurt(w.x);
    if(w.x<a.x0*T-10||w.x>(a.x1+1)*T+10)w.dead=1;
  }
  WAVES=WAVES.filter(w=>!w.dead);
  /* gears */
  for(const gr of GEARS){
    gr.r+=.2;
    if(gr.st===0){gr.warn--;if(gr.warn<=0)gr.st=1;}
    else if(gr.st===1){
      gr.vy=Math.min(gr.vy+.3,6);gr.y+=gr.vy;
      if(Math.abs(pcx-gr.x)<10&&Math.abs(pcy-gr.y)<12)hurt(gr.x);

    }else{
      gr.l--;
      if(gr.l>8&&Math.abs(pcx-gr.x)<11&&P.y+P.h>fl-10)hurt(gr.x);
      if(gr.l<=0)gr.dead=1;
    }
  }
  GEARS=GEARS.filter(q=>!q.dead);
}

function mgGenSpots(n,gap){gap=gap||44;

  if(m.crit){m.crit.t++;if(m.crit.t>60)m.crit=null;}

  if(m.spark){m.spark.t--;if(m.spark.spot.state!=='hid'||m.spark.t<=0)m.spark=null;else if(m.t%6===0)mgPts(m,m.spark.spot.x+(Math.random()*16-8),m.spark.spot.y-6-Math.random()*12,['#fff6a0','#ffffff','#ffd23f'][m.t%3],1);}
  for(const p of m.pts){p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.l--;}m.pts=m.pts.filter(p=>p.l>0);
  m.act=m.srch||m.deliv.length?null:(mgNearNpc(m)||mgNearSpot(m));

function miniStep(){
  const m=MG;
  if(!m){S.mode='title';return;}
  if(m.st==='pick'){
    m.t++;
    if(IN.pause){S.mode='title';stopMusic();sfx.pick();}
    else{
      if(IN.pl||IN.pr){m.sel=m.sel?0:1;sfx.pick();}
      if(IN.ok){
        let go=true;
        if(IN.tapX>=0){const s=IN.tapX<.5?0:1;if(s!==m.sel){m.sel=s;sfx.pick();go=false;}}
        if(go){sfx.pick();mgStart(m.sel?'aud':'ame');}
      }
    }
  }else if(m.st==='play')mgUpdate(m);
  else if(m.st==='pause'){
    if(IN.pause){m.st='play';startMusic(MG_MUSIC);}
    else if(IN.dp){S.mode='title';stopMusic();sfx.pick();}
  }else if(m.st==='win'){
    m.wt++;m.t=m.t;
    for(const p of m.pts){p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.l--;}m.pts=m.pts.filter(p=>p.l>0);
    if(m.wt%10===0)mgPts(m,MG_HOUSE.door.cx+(Math.random()*60-30),MG_HOUSE.door.cy-30-Math.random()*20,['#ff7a9a','#ffd23f','#9fe8ff'][m.wt%3],4);
    if(m.wt>60){
      if(IN.pause){S.mode='title';stopMusic();sfx.pick();}
      else if(IN.ok){mgStart(m.who);}
    }
  }
  IN.ok=0;IN.tapX=-1;IN.pause=0;IN.pl=0;IN.pr=0;IN.num=0;IN.dp=0;IN.swap=0;IN.jb=0;IN.z=0;IN.c=0;
}

function wrap(s,maxW){
  const ws=s.split(' '),out=[];let cur='';

function gearShape(cx,cy,r,n,rot,col,col2){
  g.fillStyle=col;g.beginPath();
  for(let i=0;i<n;i++){const a=rot+i*6.2832/n,w1=3.1416/n*.7,w2=3.1416/n*.4;
    const pts=[[a-w1,r*.8],[a-w2,r],[a+w2,r],[a+w1,r*.8]];
    pts.forEach((p,j)=>{const px=cx+Math.cos(p[0])*p[1],py=cy+Math.sin(p[0])*p[1];if(i===0&&j===0)g.moveTo(px,py);else g.lineTo(px,py);});}
  g.closePath();g.fill();g.fillStyle=col2;g.beginPath();g.arc(cx,cy,r*.35,0,6.3);g.fill();
}

function loadMeta(){try{const d=localStorage.getItem('aa8_diff');if(d!==null&&+d>=0&&+d<=2)S.diff=+d;const c=localStorage.getItem('aa8_clr');if(c&&c.length===10)S.clr=c.split('').map(Number);const sc=localStorage.getItem('aa8_sec');if(sc&&sc.length===10)S.sec=sc.split('').map(Number);for(const [k,key] of [['bs','aa8_bs'],['bt','aa8_bt']]){const v=localStorage.getItem(key);if(v){const a=v.split(',').map(Number);if(a.length===10&&a.every(n=>isFinite(n)))S[k]=a;}}}catch(e){}}
function loadProg(){loadMeta();let v=0;try{v=localStorage.getItem('aa8_ch1')==='1';}catch(e){}try{if(location.hash==='#ch2')v=1;}catch(e){}S.ch2=v?1:0;}
loadProg();
function resetGame(){S.clues=[0,0,0,0,0,0];S.frags=[0,0,0,0];S.score=0;S.stage=0;S.petSel=0;S.mode='title';stopMusic();}
function startCh2(){S.stage=4;S.petSel=0;startDialog(STORY.ch2intro,4,()=>goPick());}
function playEnding(){S.stage=9;S.t=0;startMusic(10);startDialog(STORY.finale,9,()=>{S.mode='fin';S.t=0;},null,1);}
function afterClear(){
  if(S.stage<3){S.stage++;goPick();}
  else if(S.stage===3)startDialog(STORY.ending,2,()=>{S.ch2=1;saveProg();S.mode='end';S.t=0;},'all');
  else if(S.stage===9)playEnding();
  else if(LEVEL_FN[S.stage+1]){S.stage++;goPick();}
  else{S.mode='soon';S.t=0;}
}
function step(){
  S.t++;
  if(S.mode==='cheat'){
    if(S.cmt>0&&--S.cmt===0){S.mode=S.cprev;}
    IN.ok=0;IN.tapX=-1;IN.pause=0;IN.pl=0;IN.pr=0;IN.num=0;IN.dp=0;IN.swap=0;IN.jb=0;IN.z=0;IN.c=0;return;
  }
  if(S.mode==='mini'){miniStep();return;}
  const m=S.mode;
  if(S.lockT>0)S.lockT--;
  if(m==='title'){
    if(IN.dp||(IN.ok&&IN.tapX>=0&&IN.tapY>.84)){IN.ok=0;IN.dp=0;miniOpen();}
    else if(IN.num){
      const st=IN.num-1;
      if(st<4){S.stage=st;goPick();}
      else if(!S.ch2){S.lockT=100;sfx.no();}
      else if(LEVEL_FN[st]){S.stage=st;S.petSel=0;goPick();}
      else{S.stage=st-1;S.mode='soon';S.t=0;}
    }
    else if(IN.ok){S.mode='diff';sfx.pick();}
  }else if(m==='diff'){
    if(IN.pause||backTap()){IN.pause=0;S.mode='title';sfx.pick();}
    else{
      if(IN.pl){S.diff=(S.diff+2)%3;sfx.pick();}
      if(IN.pr){S.diff=(S.diff+1)%3;sfx.pick();}
      if(IN.ok){
        let go=true;
        if(IN.tapX>=0){const t=clamp(Math.floor((IN.tapX*W-8)/82),0,2);if(t!==S.diff){S.diff=t;sfx.pick();go=false;}}
        if(go){saveMeta();S.mode='chap';S.csel=S.ch2&&S.clr[3]&&!S.clr[9]?1:0;sfx.pick();}
      }
    }
  }else if(m==='chap'){
    if(IN.pause||backTap()){IN.pause=0;S.mode='diff';sfx.pick();}
    else{
      if(IN.pl||IN.pr){S.csel=1-S.csel;sfx.pick();}
      if(S.clr[9]&&(IN.dp||(IN.ok&&IN.tapX>=0&&IN.tapY>.88))){IN.ok=0;playEnding();}
      else if(IN.ok){
        let go=true;
        if(IN.tapX>=0){const t=IN.tapX<.5?0:1;if(t!==S.csel){S.csel=t;sfx.pick();go=false;}}
        if(go){if(S.csel===0||S.ch2){S.chap=S.csel;S.lsel=0;S.mode='lvl';sfx.pick();}else{S.lockT=60;sfx.no();}}
      }
    }
  }else if(m==='lvl'){
    const list=CHAP_LV[S.chap],n=list.length;
    if(IN.pause||backTap()){IN.pause=0;S.mode='chap';sfx.pick();}
    else{
      if(IN.pl){S.lsel=(S.lsel+n-1)%n;sfx.pick();}
      if(IN.pr){S.lsel=(S.lsel+1)%n;sfx.pick();}
      if(IN.dp){S.lsel=(S.lsel+3)%n;sfx.pick();}
      if(IN.ok){
        let go=true;
        if(IN.tapX>=0){const col=clamp(Math.floor((IN.tapX*W-10)/80),0,2),row=IN.tapY*H>92?1:0,i=row*3+col;
          if(i<n&&i!==S.lsel){S.lsel=i;sfx.pick();go=false;}else if(i>=n)go=false;}
        if(go){
          const st=list[S.lsel];S.stage=st;S.petSel=0;sfx.pick();
          if(st===0)startDialog(STORY.intro,0,()=>goPick());
          else if(st===4)startDialog(STORY.ch2intro,4,()=>goPick());
          else goPick();
        }
      }
    }
  }else if(m==='pick'){
    const n=petList().length;
    if(IN.pl)S.petSel=(S.petSel+n-1)%n;
    if(IN.pr)S.petSel=(S.petSel+1)%n;
    if(IN.ok){
      if(IN.tapX>=0){
        let i;
        if(n>3){const row=IN.tapY>.5?1:0;i=clamp(row*3+Math.floor(IN.tapX*3),0,n-1);}else i=clamp(Math.floor(IN.tapX*3),0,2);
        if(i!==S.petSel){S.petSel=i;sfx.pick();}else{S.mode='card';S.ct=0;sfx.pick();}}
      else{S.mode='card';S.ct=0;sfx.pick();}
    }
    if(IN.pl||IN.pr)sfx.pick();
  }else if(m==='card'){
    S.ct++;if(S.ct>130||(IN.ok&&S.ct>15))startStage(S.stage);
  }else if(m==='play')updPlay();
  else if(m==='pause'){if(IN.pause||IN.ok){IN.pause=0;S.mode='play';startMusic(S.stage);}}
  else if(m==='dead'){
    S.dt++;P.vy+=.3;P.y+=P.vy;
    if(S.dt>100){P.hp=P.mh;P.shield=S.pet==='mavie';P.shCD=0;P.vine=null;P.dive=0;P.dash=0;if(LV.arena)bossReset();respawnAt(S.cp);S.mode='play';startMusic(S.stage);}
  }else if(m==='clear'){
    S.ct++;for(const q of PART){q.x+=q.vx;q.y+=q.vy;q.l--;}PART=PART.filter(q=>q.l>0);
    if(S.ct>170||(IN.ok&&S.ct>60)){
      if(S.stage>=4)startDialog(STORY.ch2clear[S.stage-4],S.stage===9?9:4,afterClear,'c'+(S.stage-4));
      else startDialog(STORY.clear[S.stage],S.stage,afterClear,S.stage<3?S.stage:'all');
    }
  }else if(m==='dlg'){
    const d=S.dlg,txt_=d.lines[d.i][1];
    if(d.pos<txt_.length)d.pos+=.7;
    if(IN.ok){
      if(d.pos<txt_.length)d.pos=txt_.length;
      else{sfx.pick();d.i++;d.pos=0;if(d.i>=d.lines.length){const f=d.done;S.dlg=null;f();}}
    }
  }else if(m==='end'){if(IN.ok)startCh2();}
  else if(m==='soon'){if(IN.ok)resetGame();}
  else if(m==='fin'){if(IN.ok)resetGame();}
  IN.ok=0;IN.pl=0;IN.pr=0;IN.num=0;IN.tapX=-1;if(m!=='play'&&m!=='pause')IN.pause=0;
  if(S.mode!=='play'){IN.swap=0;IN.jb=0;IN.z=0;IN.c=0;IN.dp=0;}
}
let lastT=0,accT=0;
function frame(ts){
  const dt=Math.min(100,ts-lastT);lastT=ts;accT+=dt;
  while(accT>=16.667){step();accT-=16.667;}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(frame);});
try{document.fonts&&document.fonts.load('8px "Press Start 2P"');}catch(e){}
window.__pet=()=>PET;window.__g={S,IN,step,startStage,get P(){return P},get EN(){return EN},get LV(){return LV},get M(){return M},press,release,render};
/* hidden developer unlock: ~ key, then password */
const DEVPW='developer123';
function cheatOpen(){if(S.mode==='cheat')return;S.cprev=S.mode;S.mode='cheat';S.cin='';S.cmsg='';S.cmt=0;IN.l=IN.r=IN.j=0;}
function cheatKey(e){
  e.preventDefault();if(S.cmt>0)return;
  const k=e.key;
  if(k==='~'||k==='`'||k==='Escape'||e.code==='Backquote'){S.mode=S.cprev;return;}
  if(k==='Enter'){
    if(S.cin===DEVPW){
      S.ch2=1;saveProg();for(let i=0;i<10;i++)S.clr[i]=1;saveMeta();
      S.cmsg='ALL UNLOCKED!';sfx.fix&&sfx.fix();
    }else{S.cmsg='WRONG PASSWORD';sfx.no&&sfx.no();}
    S.cin='';S.cmt=70;return;
  }
  if(k==='Backspace'){S.cin=S.cin.slice(0,-1);return;}
  if(k.length===1&&S.cin.length<20)S.cin+=k;
}
function drawCheat(){
  g.fillStyle='rgba(0,0,0,.7)';g.fillRect(0,0,W,H);
  g.fillStyle='#1a1030';g.fillRect(28,66,200,60);g.strokeStyle='#ffd23f';g.lineWidth=1;g.strokeRect(28.5,66.5,199,59);
  if(S.cmsg){txt(S.cmsg,128,90,S.cmsg[0]==='A'?'#6aff9a':'#ff7a9a','center');return;}
  txt('DEVELOPER',128,74,'#ffd23f','center');
  txt('*'.repeat(S.cin.length)+((S.t>>4)%2?'_':''),128,96,'#fff','center');
  txt('ENTER: OK   ~: CLOSE',128,114,'#9a8bb5','center',6);
}

/* mobile joystick for Pet Hunt */
(function(){
  const pad=document.getElementById('pad'),joy=document.getElementById('joy'),knob=document.getElementById('knob');
  let id=null;const R=44,DZ=.28;
  function setDir(l,r,u,d){
    if(l&&!IN.l)IN.pl=1; if(r&&!IN.r)IN.pr=1;
    IN.l=l?1:0;IN.r=r?1:0;IN.j=u?1:0;IN.d=d?1:0;
  }
  function move(e){
    const b=joy.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
    let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy);
    if(len>R){dx*=R/len;dy*=R/len;}
    knob.style.transform='translate('+dx+'px,'+dy+'px)';
    const t=R*DZ;setDir(dx<-t,dx>t,dy<-t,dy>t);
  }
  function end(){id=null;knob.style.transform='';setDir(0,0,0,0);}
  joy.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();id=e.pointerId;joy.setPointerCapture(id);move(e);});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===id)move(e);});
  joy.addEventListener('pointerup',e=>{if(e.pointerId===id)end();});
  joy.addEventListener('pointercancel',end);
  bindBtn('bZ2','z');bindBtn('bS2','s');
  document.getElementById('bP2').addEventListener('pointerdown',e=>{e.preventDefault();IN.pause=1;});
  let last='';
  setInterval(()=>{const m=S.mode==='mini'?'1':'0';if(m!==last){last=m;pad.dataset.m=m;if(m==='0')end();fit();}},100);
})();
